name: SonarQube local analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Build, test and analyze
    # This runner must be registered on the laptop that runs SonarQube.
    # No pull_request trigger: the repository is public and the runner is personal.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check SonarQube settings
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw 'Create the repository variable SONAR_HOST_URL (for this laptop: http://localhost:9000).'
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw 'Create the repository secret SONAR_TOKEN with an analysis token for this SonarQube project.'
          }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests and JaCoCo coverage
        shell: powershell
        run: |
          $bytes = New-Object byte[] 48
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $env:JWT_SECRET = [Convert]::ToBase64String($bytes)
          Push-Location backend
          try {
            .\mvnw.cmd -B -ntp verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests and coverage
        working-directory: frontend
        run: npm run test:coverage -- --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
