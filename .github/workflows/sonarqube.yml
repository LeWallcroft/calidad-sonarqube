name: SonarQube local analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Build, test and analyze
    # This runner must be registered on the laptop that runs SonarQube.
    # No pull_request trigger: the repository is public and the runner is personal.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL || 'http://localhost:9000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check SonarQube settings
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if not defined SONAR_HOST_URL (
            echo Create repository variable SONAR_HOST_URL, for example http://localhost:9000.
            exit /b 1
          )
          if not defined SONAR_TOKEN (
            echo Create repository secret SONAR_TOKEN with a project analysis token.
            exit /b 1
          )

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests and JaCoCo coverage
        shell: cmd
        env:
          JWT_SECRET: ci-test-only-key-not-for-deployment-0123456789abcd
        run: |
          cd backend
          call mvnw.cmd -B -ntp verify
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests and coverage
        working-directory: frontend
        run: npm run test:coverage -- --browsers=ChromeHeadless

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
