sonar.projectKey=calidad-sonarqube
sonar.projectName=Calidad SonarQube - Dulce Miel Demo
sonar.sourceEncoding=UTF-8

# Production code. Frontend tests live in frontend/tests, outside the source tree.
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/tests

# Java needs compiled bytecode for source analysis.
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Import coverage reports generated by JaCoCo and Karma, respectively.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/ihc-frontend/lcov.info

# Exclude only generated/dependency output and ephemeral QA data.
sonar.exclusions=**/target/**,**/dist/**,**/coverage/**,**/node_modules/**,qa/**
